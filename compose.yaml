name: campuseats-v1
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sky_take_out
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/start.ps1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/start.ps1}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL","MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u campus sky_take_out -Nse 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 768m
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/start.ps1}
    command: ["sh","-c","exec redis-server --appendonly yes --maxmemory 80mb --maxmemory-policy allkeys-lru --requirepass \"$$REDIS_PASSWORD\""]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL","REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 160m
  server:
    image: campuseats-server:v1
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker,demo
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?Run scripts/start.ps1}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?Run scripts/start.ps1}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:18083,http://127.0.0.1:18083}
      CAMPUS_MOCK_PAYMENT_ENABLED: ${MOCK_PAYMENT_ENABLED:-true}
      TZ: Asia/Shanghai
    volumes: ["uploads:/app/uploads"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 768m
  web:
    image: campuseats-web:v1
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18083}:80"]
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -q -O /dev/null http://127.0.0.1/admin/ && wget -q -O /dev/null http://127.0.0.1/api/v1/user/shop"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
volumes:
  mysql-data:
  redis-data:
  uploads:
