name: campuseats
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sky_take_out
      MYSQL_USER: campus
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run scripts/start.ps1 first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run scripts/start.ps1 first}
      TZ: Asia/Shanghai
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u campus sky_take_out -Nse 'SELECT COUNT(*) FROM employee' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 768m
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/start.ps1 first}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 128m
  server:
    image: campuseats-server:local
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?Run scripts/start.ps1 first}
      JWT_USER_SECRET: ${JWT_USER_SECRET:?Run scripts/start.ps1 first}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      MOCK_PAYMENT_ENABLED: ${MOCK_PAYMENT_ENABLED:-true}
      DELIVERY_CHECK_ENABLED: ${DELIVERY_CHECK_ENABLED:-false}
      WECHAT_APPID: ${WECHAT_APPID:-}
      WECHAT_SECRET: ${WECHAT_SECRET:-}
      BAIDU_AK: ${BAIDU_AK:-}
      SHOP_ADDRESS: ${SHOP_ADDRESS:-陕西省西安市长安区常宁宫}
      SKY_SHOP_PHONE: ${SHOP_PHONE:-}
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/user/shop/status | grep -q '\"code\":1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    mem_limit: 768m
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18083}:80"
    volumes:
      - ./deploy/admin:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/dish.svg:/etc/nginx/dish.svg:ro
      - ./deploy/images:/etc/nginx/images:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ && wget -q -O - http://127.0.0.1/user/shop/status | grep -q '\"code\":1'"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 128m
volumes:
  mysql-data:
  redis-data:
  uploads:
