map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format campus '$remote_addr $request_method $uri $status $request_time';
server {
 listen 80;
 server_name localhost;
 absolute_redirect off;
 root /usr/share/nginx/html;
 access_log /var/log/nginx/access.log campus;
 client_max_body_size 6m;
 gzip on;
 gzip_min_length 1024;
 gzip_types application/json application/javascript text/css;
 location ~ ^/(admin|app)/assets/ { try_files $uri =404; expires 7d; }
 error_page 502 504 = @api_unavailable;
 error_page 413 = @input_too_large;
 location @api_unavailable { default_type application/json; return 503 '{"code":"UNAVAILABLE","message":"服务暂不可用","data":null,"requestId":"$request_id"}'; }
 location @input_too_large { default_type application/json; return 400 '{"code":"INVALID_INPUT","message":"上传内容过大","data":null,"requestId":"$request_id"}'; }
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy same-origin always;
 add_header X-Frame-Options DENY always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none'" always;
 location = / { return 302 /admin/; }
 location /admin/ { try_files $uri $uri/ /admin/index.html; }
 location /app/ { try_files $uri $uri/ /app/index.html; }
 location /demo-images/ { try_files $uri =404; }
 location /api/v1/ {
   proxy_pass http://server:8080;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_connect_timeout 2s;
   proxy_read_timeout 20s;
 }
 location /uploads/ { proxy_pass http://server:8080; }
 location /v3/api-docs { proxy_pass http://server:8080; }
 location = /actuator/prometheus { proxy_pass http://server:8080; }
 location = /actuator/health/readiness { proxy_pass http://server:8080; }
 location /ws/orders {
   proxy_pass http://server:8080;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_set_header Origin $http_origin;
   proxy_read_timeout 90s;
 }
 location / { return 404; }
}
