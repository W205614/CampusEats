map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    client_max_body_size 10m;
    location / { try_files $uri $uri/ /index.html; }
    location = /demo-images/dish.svg { alias /etc/nginx/dish.svg; }
    location /demo-images/ { alias /etc/nginx/images/; }
    location /api/ { proxy_pass http://server:8080/admin/; }
    location /user/ { proxy_pass http://server:8080; }
    location /admin/ { proxy_pass http://server:8080; }
    location /uploads/ { proxy_pass http://server:8080; }
    location = /doc.html { proxy_pass http://server:8080; }
    location /webjars/ { proxy_pass http://server:8080; }
    location /swagger-resources { proxy_pass http://server:8080; }
    location /v2/api-docs { proxy_pass http://server:8080; }
    location /ws/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
