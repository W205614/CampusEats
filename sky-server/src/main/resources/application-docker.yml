spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
sky:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: mysql
    port: 3306
    database: sky_take_out
    username: campus
    password: ${MYSQL_PASSWORD}
  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}
    database: 10
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET}
    user-secret-key: ${JWT_USER_SECRET}
  demo:
    enabled: ${DEMO_ENABLED:true}
  payment:
    mock-enabled: ${MOCK_PAYMENT_ENABLED:true}
  delivery:
    check-enabled: ${DELIVERY_CHECK_ENABLED:false}
  storage:
    local-enabled: true
    upload-dir: /app/uploads
  alioss:
    endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET:}
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
  shop:
    address: ${SHOP_ADDRESS:陕西省西安市长安区常宁宫}
  baidu:
    ak: ${BAIDU_AK:}
logging:
  level:
    com.sky.mapper: info
