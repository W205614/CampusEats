name: Security and quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Compile the Java application for analysis
        if: matrix.language == 'java-kotlin'
        run: mvn -B -ntp -DskipTests clean package
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: .local/codeql-results
          wait-for-processing: true
      - name: Report all original security and quality findings
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          reports = list(Path('.local/codeql-results').glob('*.sarif'))
          if not reports:
              raise SystemExit('CodeQL did not produce a SARIF report.')
          count = sum(len(run.get('results', [])) for path in reports
                      for run in json.loads(path.read_text())['runs'])
          print(f'CodeQL findings across all severities: {count}')
          PY
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}-${{ github.sha }}
          path: .local/codeql-results/
          if-no-files-found: error
          retention-days: 7
  unresolved-alerts:
    name: Require zero unresolved CodeQL alerts
    needs: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Check every severity after all analyses finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          query = urlencode({'state': 'open', 'ref': os.environ['GITHUB_REF'],
                             'tool_name': 'CodeQL', 'per_page': 100})
          url = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}/code-scanning/alerts?{query}"
          request = Request(url, headers={'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                                         'Accept': 'application/vnd.github+json'})
          with urlopen(request, timeout=60) as response:
              alerts = json.load(response)
          if not isinstance(alerts, list):
              raise SystemExit('Code scanning did not return an alert list.')
          print(f'Open CodeQL alerts, first page up to 100: {len(alerts)}')
          if alerts:
              for alert in alerts:
                  print(f"#{alert['number']}: {alert['rule']['id']}")
              raise SystemExit('Unresolved security or quality alerts remain.')
          PY
