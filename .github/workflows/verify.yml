name: Verify CampusEats
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows-permissions:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real Windows credential ACL and fail-before-write behavior
        shell: pwsh
        run: ./scripts/test-secure-files.ps1
      - name: Verify release bundle provenance rejection without Docker
        shell: pwsh
        run: ./scripts/test-release-bundle.ps1
      - name: Verify OCI image identity and bounded artifact transfer
        shell: pwsh
        run: |
          ./scripts/test-image-identity.ps1
          ./scripts/test-github-artifact-transfer.ps1
      - name: Verify cross-platform migration hash normalization
        shell: pwsh
        run: ./scripts/test-migration-hash.ps1
      - name: Validate schedule XML with native Windows definitions without registering
        shell: pwsh
        run: ./scripts/ops-schedule.ps1 -OutputDirectory .local/ci-schedule-preview
  verify:
    needs: windows-permissions
    # The release verifier deliberately supports direct OCI manifests/raw layers.
    # Keep the runner family used by the accepted artifact instead of an OS rollout.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify supported Docker image store
        shell: pwsh
        run: |
          $driver=(& docker info --format '{{.Driver}}') -join ''
          if($LASTEXITCODE -ne 0 -or $driver -cne 'overlay2'){throw 'CI image-store format changed; verify archive compatibility before testing or publishing.'}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            frontend/admin/package-lock.json
            frontend/client/package-lock.json
      - run: mvn -B -ntp clean verify
      - run: npm ci --prefix frontend/admin && npm run test:toolchain --prefix frontend/admin && npm run build --prefix frontend/admin
      - run: npm ci --prefix frontend/client --include=optional && npm run test:toolchain --prefix frontend/client && npm run typecheck --prefix frontend/client && npm run build:h5 --prefix frontend/client && npm run build:mp-weixin --prefix frontend/client
      - name: Check generated API types
        run: node scripts/generate-contracts.mjs && git diff --exit-code -- frontend/contracts/openapi.ts
      - name: Dependency audit
        run: |
          mkdir -p .local
          npm audit --prefix frontend/admin --registry=https://registry.npmjs.org --audit-level=info
          npm audit --prefix frontend/client --registry=https://registry.npmjs.org --json > .local/audit-client.json || true
          node scripts/check-client-audit.mjs
          node --test scripts/check-client-audit.test.mjs
      - name: Verify isolated performance fixture boundaries
        run: node --test scripts/prepare-performance.test.mjs scripts/measure-performance.test.mjs
      - name: Start source-built demo
        shell: pwsh
        run: |
          ./scripts/test-release-safety.ps1
          ./scripts/test-ops-check.ps1
          ./scripts/test-ops-run.ps1
          ./scripts/test-image-scan.ps1
          ./scripts/test-secure-files.ps1
          ./scripts/test-encrypted-backup.ps1
          ./scripts/test-release-bundle.ps1
          ./scripts/test-image-identity.ps1
          ./scripts/test-github-artifact-transfer.ps1
          ./scripts/test-platform-data-manifest.ps1
          ./scripts/test-migration-hash.ps1
          ./scripts/test-artifact-release.ps1
          ./scripts/test-restore-ownership.ps1
          ./scripts/start.ps1 -SkipVerify
      - name: Verify real image archive before browser regression
        shell: pwsh
        run: |
          . ./scripts/image-identity.ps1
          $references=@()
          foreach($service in @('server','web')){
            $reference='campuseats-'+$service+':sha-'+$env:GITHUB_SHA
            & docker image tag ('campuseats-'+$service+':v1') $reference
            if($LASTEXITCODE -ne 0){throw 'Cannot reference the source-built image.'}
            $references+=$reference
          }
          $archive=Join-Path $PWD '.local/ci-image-layout.tar'
          if(Test-Path -LiteralPath $archive){throw 'Refuse to reuse a previous CI layout archive.'}
          & docker image save --output $archive @references
          if($LASTEXITCODE -ne 0){throw 'Cannot inspect the actual source-built archive.'}
          foreach($identity in @(Read-ReleaseImageGraph -Archive $archive -SourceSha $env:GITHUB_SHA)){
            $raw=(& docker image inspect $identity.reference) -join "`n"
            if($LASTEXITCODE -ne 0){throw 'Cannot inspect the source-built runtime identity.'}
            $actual=@($raw|ConvertFrom-Json)[0]
            $identity|Add-Member -NotePropertyName sourceRuntimeId -NotePropertyValue $actual.Id
            [void](Resolve-ReleaseImageIdentity -Expected $identity -Actual $actual)
          }
      - name: Compare live API schema
        run: node scripts/generate-contracts.mjs --fetch && git diff --exit-code -- frontend/contracts/openapi.json frontend/contracts/openapi.ts
      - name: Check deployment smoke and root redirect
        shell: pwsh
        run: ./scripts/smoke.ps1
      - run: npx --prefix frontend/admin playwright install --with-deps chromium
      - run: npm run test --prefix frontend/admin
      - run: node scripts/check-websocket.mjs
      - name: Verify independent backup restore
        shell: pwsh
        run: |
          ./scripts/safe-backup.ps1 -Destination (Join-Path $PWD '.local/backups/ci-restore')
          ./scripts/smoke.ps1
          ./scripts/ops-check.ps1
      - name: Scan all four service images and retain SBOMs
        shell: pwsh
        run: |
          $mysql=(& docker inspect --format '{{.Image}}' (& docker compose ps -q mysql)) -join ''
          if($LASTEXITCODE -ne 0 -or !$mysql){throw 'Cannot resolve the tested MySQL image.'}
          $redis=(& docker inspect --format '{{.Image}}' (& docker compose ps -q redis)) -join ''
          if($LASTEXITCODE -ne 0 -or !$redis){throw 'Cannot resolve the tested Redis image.'}
          ./scripts/scan-images.ps1 -ServerImage campuseats-server:v1 -WebImage campuseats-web:v1 -MySqlImage $mysql -RedisImage $redis -OutputDirectory '.local/security'
      - name: Export the same tested and scanned application images
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        shell: pwsh
        run: ./scripts/export-release.ps1
      - name: Upload immutable deployment bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          overwrite: true
          path: .local/release-bundle/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          overwrite: true
          path: |
            sky-server/target/surefire-reports
            .local/playwright-results
            .local/playwright-report
            .local/audit-client.json
            .local/backups/ci-restore/restore-check.txt
            .local/security/
          retention-days: 7
